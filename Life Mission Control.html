<style>

<header><h1>Life Mission Control</h1><div class="sm">Goals · Study · Money · Health · Career · Books</div></header><nav id="nav"></nav><main id="v"></main><p class="sm foot">Your data is saved in this browser, on this device.</p>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYS=['goals','tasks','cal','courses','exams','inc','exp','wish','work','read','want','certs','exch','skills','ideas','plan'];
let S={};try{S=JSON.parse(localStorage.getItem('mmc')||'{}')||{}}catch(e){}
KEYS.forEach(k=>S[k]=S[k]||[]);S.pass??=5;S.max??=10;S.tab??='Home';S.go??=0;S.bo??=0;S.cy??=new Date().getFullYear();S.cmo??=new Date().getMonth();S.cv??='month';S.bono??={mode:'dis',items:[]};
if(!S.plan.length)S.plan=[['Mon','Oats, berries, flax','Lentil bowl','Tofu stir-fry','Hummus + fruit'],['Tue','Smoothie + peanut butter toast','Chickpea wrap','Pasta, veg, white beans','Dates + nuts'],['Wed','Tofu scramble','Buddha bowl','Lentil curry + rice','Soy yoghurt'],['Thu','Oats, banana','Quinoa salad','Tempeh tacos','Fruit + almonds'],['Fri','Chia pudding','Falafel bowl','Veggie pizza','Hummus + carrots'],['Sat','Pancakes + fruit','Sushi (veg)','Seitan + potatoes','Energy balls'],['Sun','Toast + avocado','Minestrone','Bean chili','Dark chocolate']].map(r=>({day:r[0],b:r[1],l:r[2],d:r[3],s:r[4]}));
const save=()=>{try{localStorage.setItem('mmc',JSON.stringify(S))}catch(e){}};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?'':n},N=v=>num(v)||0;
const today=()=>new Date().toISOString().slice(0,10),days=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const cd=d=>{if(!d)return'';const n=days(d);return n<0?-n+'d ago':n==0?'today':n+'d left'};
const so=(a,v)=>a.map(o=>`<option${o==v?' selected':''}>${o}</option>`).join('');
const GEN=['Aviation','Space','Engineering','Endurance & sport','Science','Business & growth','Fiction','Other'],AREAS=['Study','Career','Sport','Money','Create','Health','Other'],PR=['High','Medium','Low'],PC={High:'#c62828',Medium:'#e0a100',Low:'#12a8b4'};
const SC={tasks:[['task','Task'],['due','Due','date'],['done','Done','chk']],
cal:[['title','Event'],['date','Date','date'],['type','Type','sel',['Deadline','Exam','Race','Application','Other']]],
courses:[['name','Course / subject'],['term','Year / term'],['credits','Credits','num'],['grade','Final grade','num']],
exams:[['course','Course / subject'],['exam','Exam / assignment'],['w','Weight %','num'],['g','Grade','num']],
inc:[['date','Date','date'],['what','Job'],['amt','Amount €','num'],['h','Hours','num']],
exp:[['date','Date','date'],['what','Expense'],['amt','Amount €','num']],
wish:[['item','Item'],['price','Price €','num'],['saved','Saved €','num'],['pri','Priority','sel',PR]],
work:[['date','Date','date'],['sport','Sport','sel',['Swim','Bike','Run','Strength','Other']],['km','Km','num'],['min','Minutes','num'],['note','Notes']],
read:[['title','Title'],['author','Author'],['genre','Genre','sel',GEN],['r','Rating (5 = best)','sel',['5','4','3','2','1']],['date','Date read','date'],['note','Notes']],
want:[['title','Title'],['author','Author'],['genre','Genre','sel',GEN]],
certs:[['title','Certificate / title'],['org','Issuer'],['date','Date','date'],['st','Status','sel',['Planned','In progress','Earned','Posted on LinkedIn']]],
exch:[['name','Programme / experience'],['where','Where'],['dl','Deadline','date'],['st','Status','sel',['Idea','Preparing','Applied','Accepted','Rejected']]],
skills:[['skill','Skill / software'],['lv','Level 1-5','sel',['1','2','3','4','5']],['note','Notes']],
ideas:[['type','Type','sel',['Book','App','Other']],['title','Title'],['stage','Stage','sel',['Idea','Outline','Building','Launched']],['note','Notes']],
plan:[['day','Day'],['b','Breakfast'],['l','Lunch'],['d','Dinner'],['s','Snacks']]};
const inp=(f,v,a='')=>{const t=f[2]||'txt';
if(t=='sel')return`<select ${a} name="${f[0]}"><option></option>${so(f[3],v)}</select>`;
if(t=='chk')return`<input type="checkbox" ${a} name="${f[0]}"${v?' checked':''}>`;
if(t=='date')return`<input type="date" ${a} name="${f[0]}" value="${esc(v)}">`;
return`<input ${a} name="${f[0]}" ${t=='num'?'inputmode="decimal"':''} ${f[0]=='course'?'list="cl"':''} value="${esc(v)}">`};
const tbl=(k,ex)=>{const c=SC[k],r=S[k];return`<form class="frm" data-f="${k}">${c.map(f=>`<label>${f[1]}${inp(f,f[2]=='date'?(S.sel||today()):'')}</label>`).join('')}<button>＋ Add entry</button></form><div class="sc"><table><tr><th></th>${ex?'<th></th>':''}${c.map(f=>`<th>${f[1]}</th>`).join('')}</tr>${r.map((x,i)=>`<tr><td><button data-d="${k}:${i}">🗑</button></td>${ex?`<td>${ex(i)}</td>`:''}${c.map(f=>`<td>${inp(f,x[f[0]],`data-e="${k}:${i}:${f[0]}"`)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="9" class="sm">Nothing here yet. Add your first entry above.</td></tr>'}</table></div>`};
const card=(t,b)=>`<section class="card"><h2>${t}</h2>${b}</section>`;
const rot=(arr,k)=>{const n=arr.length,s=(k*6)%(n||1);return Array.from({length:Math.min(6,n)},(_,i)=>arr[(s+i)%n])};
// ---- recommended goals
const TOP=['propulsion','aerodynamics','avionics','satellite design','orbital mechanics','flight control','composite materials','CFD','heat transfer','rocket staging','structural analysis','thermodynamics','rocket engines','guidance and navigation','space systems','hypersonic flight','aircraft stability','spacecraft thermal control','reentry','electric propulsion','Mars missions','drone design'];
const ACT=[['Build a CAD model on ','Career','Design and model a small part or system in SolidWorks to show practical skills.'],['Write a LinkedIn post about ','Career','Explain one idea simply to build your public profile.'],['Read a research paper on ','Study','Read it, summarise it and note three takeaways.'],['Run a simulation on ','Study','Set up a small MATLAB/Python/CFD simulation and document the results.'],['Summarise a real NASA/ESA mission case on ','Study','Write a one-page summary of what went right and wrong.'],['Sketch a mini-project idea on ','Career','Define a small project you could finish in a month and add to your CV.']];
const BASE=[['Earn the SolidWorks CSWA certificate','Career','A recognised credential for your CV and LinkedIn.'],['Research NASA Pathways internship requirements','Career','Know the exact requirements early so you can plan your degree around them.'],['Apply for an exchange programme','Career','International experience strengthens an aerospace profile.'],['Join a university rocketry or UAV team','Career','Hands-on projects are what recruiters remember.'],['Swim 3.8 km non-stop','Sport','The Ironman swim distance, a key milestone.'],['Run a half marathon','Sport','Builds the running base for a full Ironman.'],['Finish a 70.3 half Ironman','Sport','The ideal stepping stone to a full Ironman.'],['Write the outline of my first book','Create','A clear outline turns a vague idea into a project.'],['Build an MVP of my app idea','Create','A small working version teaches more than months of planning.'],['Save €500 towards my wishlist','Money','A concrete savings target keeps weekend work motivating.'],['Complete a sprint triathlon','Sport','A first multisport race builds transitions and confidence.'],['Run a 10K under 50 minutes','Sport','A clear pace target for your running base.'],['Do an open-water swim race','Sport','Practice sighting and swimming in open water, as in an Ironman.'],['Ride 100 km on a road bike','Sport','Builds the bike endurance an Ironman needs.'],['Run a full marathon','Sport','The final leg of an Ironman, trained on its own first.'],['Follow a 12-week training plan','Sport','Consistency over weeks beats occasional heroic sessions.'],['Learn Python for engineering','Study','Useful for simulations, data and almost every aerospace project.'],['Learn MATLAB and Simulink basics','Study','Standard tools in aerospace control and analysis.'],['Update my CV with three projects','Career','Recruiters read projects first; make them visible.'],['Contact a professor about research','Career','Research experience opens doors to NASA and ESA programmes.'],['Apply for an ESA or Airbus internship','Career','Concrete industry experience on your path to NASA.'],['Attend an aerospace webinar or conference','Career','Meet people and learn what the industry values.'],['Build a portfolio website','Career','One link that shows your projects, certificates and skills.'],['Open an emergency savings fund','Money','A buffer keeps your studies stress-free.'],['Track every expense for 30 days','Money','Awareness of where money goes is the first step to saving.'],['Publish the first chapter of my book','Create','Sharing early gives feedback and momentum.'],['Launch a landing page for my app','Create','Test interest before building everything.'],['Cook five new vegan recipes','Health','Variety keeps a healthy diet easy to keep.'],['Get a blood test (iron, B12, vitamin D)','Health','Useful for an endurance athlete on a vegan diet.'],['Sleep 8 hours for 14 days','Health','Sleep is the cheapest performance boost for study and training.']];
const POOL=[...BASE.map(b=>({t:b[0],a:b[1],ds:b[2]})),...TOP.flatMap(t=>ACT.map(a=>({t:a[0]+t,a:a[1],ds:a[2]+' Topic: '+t+'.'})))];
const recs=()=>{const have=S.goals.map(g=>g.t);return rot(POOL.filter(p=>!have.includes(p.t)),S.go).map(p=>`<div class="rc"><div class="row" data-a="rt:${esc(p.t)}"><b>${esc(p.t)}</b><span class="sm">${p.a}</span><button data-a="ra:${esc(p.t)}">＋</button></div>${S.ro==p.t?`<p class="sm">${esc(p.ds)}<br>First steps: 1) define the scope 2) block three sessions this week 3) log the result.</p>`:''}</div>`).join('')};
// ---- goals
const goalCard=(x,i)=>{const o=S.open===i;return`<div class="g" data-i="${i}"><div class="gi" style="border-left-color:${PC[x.p]||'#12a8b4'}"><div class="row" data-a="tg:${i}"><b>${esc(x.t)}</b><span class="sm">${esc(x.a)} · ${esc(x.p)}${x.d?' · '+cd(x.d):''} · ${x.pr||0}%</span></div><div class="bar"><i style="width:${x.pr||0}%"></i></div>${o?`<div class="frm" style="margin-top:8px"><label style="grid-column:1/-1">What this goal is about<textarea rows="3" data-g="${i}:ds">${esc(x.ds)}</textarea></label><label>Area<select data-g="${i}:a">${so(AREAS,x.a)}</select></label><label>Priority<select data-g="${i}:p">${so(PR,x.p)}</select></label><label>Deadline<input type="date" data-g="${i}:d" value="${esc(x.d)}"></label><label>Progress ${x.pr||0}%<input type="range" min="0" max="100" step="5" data-g="${i}:pr" value="${x.pr||0}"></label></div>`:''}</div></div>`};
// ---- calendar
const evs=()=>[...S.cal.map(e=>[e.date,e.title,e.type]),...S.goals.filter(g=>g.d).map(g=>[g.d,g.t,'Goal']),...S.tasks.filter(t=>t.due&&!t.done).map(t=>[t.due,t.task,'Task']),...S.exch.filter(x=>x.dl).map(x=>[x.dl,x.name,'Application'])].filter(e=>e[0]).sort((a,b)=>a[0]<b[0]?-1:1);
const evT=l=>`<div class="sc"><table>${l.map(e=>`<tr><td>${e[0]}</td><td>${esc(e[1])}</td><td>${e[2]}</td><td><b>${cd(e[0])}</b></td></tr>`).join('')||'<tr><td class="sm">Nothing scheduled.</td></tr>'}</table></div>`;
// ---- health data
const SIT=[['Fatigue','tired exhausted energy','Iron + vitamin C: lentils, tofu, pumpkin seeds with peppers or citrus; oats and bananas for steady energy. If it persists, check iron, B12 and vitamin D.'],
['Pre-competition (day before)','race before carbs','Carb-load: pasta, rice, potatoes, white bread. Low fibre and fat at dinner, familiar foods only, hydrate with electrolytes.'],
['Race morning','morning breakfast start','2-3 h before: oats with banana and maple syrup, or white toast with jam. Coffee if you tolerate it, sip water.'],
['Long race / Ironman fuelling','during bike gel','About 60-90 g carbs per hour: gels, dates, banana, rice cakes, sports drink, plus sodium. Practise in training.'],
['Post-workout recovery','after recovery','Within an hour: carbs + protein, e.g. soy milk, pea-protein banana smoothie or a tofu rice bowl.'],
['After swimming','swim pool hungry','Swimming makes you hungry: hummus wraps, peanut butter toast, fruit and plenty of fluids.'],
['Inflammation','swollen joints pain','Berries, tart cherries, turmeric with black pepper, leafy greens, walnuts, flax, olive oil. Limit ultra-processed food.'],
['Muscle soreness','sore doms','Tart cherry juice, enough protein and carbs, magnesium (pumpkin seeds, spinach).'],
['Cramps','cramp','Fluids with sodium and potassium: banana, potatoes, coconut water, salted nuts.'],
['Heat / dehydration','hot thirsty','Water with electrolytes, watermelon, cucumber, oranges, miso soup.'],
['Bloating','gas bloated','Smaller portions, ginger or peppermint tea, cooked rather than raw veg, add legumes gradually.'],
['Stress / anxiety','stressed anxious nervous','Magnesium (greens, seeds), omega-3 (walnuts, chia), oats, dark chocolate. Limit caffeine.'],
['Poor sleep','sleep insomnia','Early dinner; oats, kiwi, tart cherry, almonds. No caffeine after midday, no heavy late meals.'],
['Headache','migraine','Hydrate first, then magnesium foods, ginger tea and regular meals. Watch caffeine.'],
['Sugar cravings','sweet sugar craving','Dates with nut butter, fruit + nuts, dark chocolate, and protein/fibre-rich meals.'],
['Cold / flu','sick sore throat','Vitamin C fruit, ginger-lemon tea, vegetable soup, garlic, lots of fluids.'],
['Nausea','sick stomach','Ginger tea, plain crackers, rice, banana, small sips of fluid. Avoid fatty foods.'],
['Constipation','fibre','Prunes, chia, flax, oats, legumes, vegetables and plenty of water.'],
['Low iron','anemia','Lentils, chickpeas, tofu, spinach and pumpkin seeds with vitamin C. No tea/coffee with meals. Check blood levels.'],
['Period cramps','menstrual period','Iron-rich foods, ginger tea, magnesium (dark chocolate, seeds), omega-3, warm meals.'],
['Injury recovery','fracture tendon injured','Enough total energy and protein, vitamin C (peppers, citrus), zinc (seeds, legumes), omega-3, calcium.'],
['Exam / study focus','exam brain concentrate','Slow carbs (oats, wholegrain), nuts, berries, water. Avoid sugar crashes.'],
['Need more protein','muscle gain','Tofu, tempeh, seitan, lentils, edamame, soy yoghurt, pea protein, spread across meals.'],
['Vegan supplements','b12 vitamin','B12 is essential on a vegan diet. Consider vitamin D and algae omega-3, and check levels with a doctor.'],
['Travelling to a race','travel hotel away','Pack oats, bars, nut butter and bananas; locate a supermarket near the venue.']];
const advise=t=>{const w=t.toLowerCase().split(/\W+/).filter(x=>x.length>2);let b=null,m=0;SIT.forEach(s=>{const h=(s[0]+' '+s[1]).toLowerCase(),c=w.filter(x=>h.includes(x)).length;if(c>m){m=c;b=s}});return b?[b[0],b[2]]:['General tips for “'+t+'”','Eat regular meals built on whole plant foods (legumes, grains, veg, fruit, nuts), stay hydrated and keep protein, iron, B12 and omega-3 covered. If symptoms persist, talk to a doctor or dietitian.']};
// ---- books
const BK=[['Skunk Works','Ben Rich','Aviation'],['Fate Is the Hunter','Ernest Gann','Aviation'],['Stick and Rudder','Wolfgang Langewiesche','Aviation'],['West with the Night','Beryl Markham','Aviation'],['The Right Stuff','Tom Wolfe','Space'],['Failure Is Not an Option','Gene Kranz','Space'],['Hidden Figures','Margot Lee Shetterly','Space'],['Carrying the Fire','Michael Collins','Space'],['Endurance','Scott Kelly','Space'],['Packing for Mars','Mary Roach','Space'],['Ignition!','John D. Clark','Engineering'],['To Engineer Is Human','Henry Petroski','Engineering'],['The Soul of a New Machine','Tracy Kidder','Engineering'],['The Design of Everyday Things','Don Norman','Engineering'],['Born to Run','Christopher McDougall','Endurance & sport'],['Endure','Alex Hutchinson','Endurance & sport'],['Ultramarathon Man','Dean Karnazes','Endurance & sport'],['Cosmos','Carl Sagan','Science'],['A Brief History of Time','Stephen Hawking','Science'],['Atomic Habits','James Clear','Business & growth'],['Deep Work','Cal Newport','Business & growth'],['The Martian','Andy Weir','Fiction'],['Project Hail Mary','Andy Weir','Fiction']];
const brec=()=>{const sc={};S.read.forEach(b=>sc[b.genre]=(sc[b.genre]||0)+(N(b.r)>=4?2:1));const have=[...S.read,...S.want].map(b=>(b.title||'').toLowerCase());return rot(BK.filter(b=>!have.includes(b[0].toLowerCase())).sort((a,b)=>(sc[b[2]]||0)-(sc[a[2]]||0)),S.bo).map(b=>`<div class="rc"><div class="row"><b>${esc(b[0])}</b><span class="sm">${esc(b[1])} · ${b[2]}</span><button data-a="rb:${esc(b[0])}">＋</button></div></div>`).join('')};
// ---- calendar views
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],EC={Exam:'#c62828',Deadline:'#d98200',Race:'#12a8b4',Application:'#6a1b9a',Goal:'#0a0a0a',Task:'#607d8b',Other:'#888'},pad=n=>String(n).padStart(2,'0');
const monthView=()=>{const y=S.cy,m=S.cmo,off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),E=evs(),t=today();let c=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="h">${d}</div>`).join('');
for(let i=0;i<Math.ceil((off+dim)/7)*7;i++){const d=i-off+1;if(d<1||d>dim){c+='<div class="dc o"></div>';continue}const ds=`${y}-${pad(m+1)}-${pad(d)}`,l=E.filter(e=>e[0]==ds);c+=`<div class="dc${ds==t?' td':''}${ds==S.sel?' sel':''}" data-a="sd:${ds}"><span>${d}</span>${l.slice(0,3).map(e=>`<i style="background:${EC[e[2]]||'#888'}">${esc(e[1])}</i>`).join('')}${l.length>3?`<em>+${l.length-3}</em>`:''}</div>`}
return`<div class="cal">${c}</div>`};
const yearView=()=>{const y=S.cy,E=evs();return`<div class="yr">${MN.map((n,m)=>{const first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();let c='';for(let i=0;i<first;i++)c+='<b></b>';for(let d=1;d<=dim;d++){const ds=`${y}-${pad(m+1)}-${pad(d)}`,l=E.filter(e=>e[0]==ds);c+=`<b class="${l.length?'ev':''}${ds==today()?' tdy':''}"${l.length?` style="background:${EC[l[0][2]]||'#888'}"`:''} title="${esc(l.map(e=>e[1]).join(', '))}">${d}</b>`}const cnt=E.filter(e=>e[0].startsWith(y+'-'+pad(m+1))).length;return`<div class="mm" data-a="sm:${m}"><div class="mt">${n.slice(0,3)} ${cnt||''}</div><div class="mg">${c}</div></div>`}).join('')}</div>`};
